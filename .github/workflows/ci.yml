name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Validate curated catalog
        run: .github/scripts/run-annotated.sh npm run catalog:validate
      - run: .github/scripts/run-annotated.sh npm run test:coverage
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Scan client bundle for server-only secrets
        run: .github/scripts/run-annotated.sh npm run check:secrets

  deno:
    name: Edge Functions type-check (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check .
        working-directory: supabase/functions

  supabase:
    name: Database, integration, and end-to-end tests
    runs-on: ubuntu-latest
    env:
      # CI-only throwaway credentials for the ephemeral local stack.
      OWNER_EMAIL: owner@ci.local
      OWNER_PASSWORD: Ci-Owner-Passw0rd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: .github/scripts/run-annotated.sh npx supabase start -x studio,imgproxy,vector,logflare,supavisor,realtime,mailpit
      - name: Database tests (pgTAP)
        run: .github/scripts/run-annotated.sh npm run test:db
      - name: Generated database types are up to date
        run: |
          npm run db:types
          if ! git diff --quiet src/lib/database.types.ts; then
            # Publish the generated file (gzip + base64, chunked) so it can be committed without log access.
            gzip -9c src/lib/database.types.ts | base64 -w0 | fold -w 30000 > /tmp/types.b64
            n=0
            while read -r chunk || [ -n "$chunk" ]; do
              echo "::notice title=database.types.ts.gz.b64 part $n::$chunk"
              n=$((n + 1))
            done < /tmp/types.b64
            echo "::error::src/lib/database.types.ts is out of date. Run npm run db:types and commit the result."
            exit 1
          fi
      - run: .github/scripts/run-annotated.sh npm run db:create-owner
      - name: Import curated catalog
        run: .github/scripts/run-annotated.sh npm run catalog:import
      - name: Re-import is idempotent (P1-1)
        run: .github/scripts/run-annotated.sh npm run catalog:import -- --expect-no-changes
      - name: Load the practice fixture
        run: .github/scripts/run-annotated.sh npm run catalog:import -- --fixture practice
      - run: npm run env:local
      - name: Integration tests
        run: .github/scripts/run-annotated.sh npm run test:int
      - name: Load the catalog performance fixture (P1-4)
        run: .github/scripts/run-annotated.sh npm run catalog:import -- --fixture practice,perf
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: .github/scripts/run-annotated.sh npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        # Run as the runner user so git accepts ownership of the mounted checkout.
        run: >
          .github/scripts/run-annotated.sh
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --redact --verbose
